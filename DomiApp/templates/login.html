{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Iniciar Sesión</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Correo</label>
                        <input type="email" name="email" class="form-control" value="cliente@demo.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" value="123456" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <hr>
                <p class="text-center text-muted small">
                    <strong>Cuentas de prueba:</strong><br>
                    Cliente: cliente@demo.com / 123456<br>
                    Domiciliario: domi@demo.com / 123456<br>
                    Admin: admin@demo.com / admin123
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
